{% extends 'partials/base.html' %}
{% load static %}
{% block main %}
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
  <div class="container my-4">
    <h3>Production Analytics</h3>

    <button class="btn btn-primary mb-3" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#productionForm">
      New Production Analytics
    </button>

    <div class="collapse" id="productionForm">
      <form method="POST" id="production-form">
        {% csrf_token %}
        <input type="hidden" name="entries_data" id="entries-data">
        <div class="card p-4 mb-4 shadow-sm">

          <div class="row mb-3 align-items-end g-2">
            <div class="col-md-2">
              <label class="form-label small mb-0">Production Date</label>
              <input type="date" id="production-date" class="form-control form-control-sm" value="{% now 'Y-m-d' %}">
            </div>
            <div class="col-md-2">
              <label class="form-label small mb-0">Product</label>
              <select id="filter-product" class="form-select form-select-sm">
                <option value="">-- All Products --</option>
                {% for p in products %}
                <option value="{{ p.code }}">{{ p.code }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small mb-0">Fetch Order</label>
              <div class="d-flex gap-1">
                <select id="fetch-order" class="form-select form-select-sm">
                  <option value="">-- Select Order --</option>
                </select>
                <button type="button" id="fetch-order-btn" class="btn btn-info btn-sm text-nowrap">Fetch</button>
              </div>
            </div>
          </div>

          <hr>

          <div id="production-rows">
            <div class="production-row">
              <div class="row mb-2 align-items-end g-1">
                <div class="col-md-2">
                  <label class="form-label small mb-0">Customer</label>
                  <input type="text" name="customer" class="form-control form-control-sm prod-customer" placeholder="Customer">
                </div>
                <div class="col-md-3">
                  <label class="form-label small mb-0">Specification</label>
                  <input type="text" name="specification" class="form-control form-control-sm prod-spec" placeholder="MM-MD-SEL">
                </div>
                <div class="col-md-1">
                  <label class="form-label small mb-0">Reference</label>
                  <input type="text" name="reference" class="form-control form-control-sm prod-ref" placeholder="Ref">
                </div>
                <div class="col-md-1">
                  <label class="form-label small mb-0">MM</label>
                  <input type="text" name="mm" class="form-control form-control-sm prod-mm" placeholder="MM">
                </div>
                <div class="col-md-1">
                  <label class="form-label small mb-0">MD</label>
                  <input type="text" name="md" class="form-control form-control-sm prod-md" placeholder="MD">
                </div>
                <input type="hidden" class="prod-product" value="">
                <div class="col-md-1">
                  <label class="form-label small mb-0">Sel</label>
                  <input type="text" name="sel" class="form-control form-control-sm prod-sel" placeholder="Sel">
                </div>
                <div class="col-md-1">
                  <label class="form-label small mb-0">PW</label>
                  <input type="text" name="pw" class="form-control form-control-sm prod-pw" placeholder="PW">
                </div>
                <div class="col-md-1">
                  <label class="form-label small mb-0">Quantity</label>
                  <input type="number" step="0.01" name="quantity" class="form-control form-control-sm prod-qty" placeholder="Qty">
                </div>
                <div class="col-md-1">
                  <label class="form-label small mb-0">Unit</label>
                  <select name="quantity_unit" class="form-select form-select-sm prod-unit">
                    <option value="KG">KG</option>
                    <option value="Bag" selected>Bag</option>
                  </select>
                </div>
              </div>

              <div class="row mb-2 align-items-end g-1">
                <div class="col-md-2">
                  <label class="form-label small mb-0">Machine</label>
                  <select name="machine" class="form-select form-select-sm prod-machine">
                    <option value="">-- Machine --</option>
                    {% for m in machines %}
                    <option value="{{ m.machine_number }}" data-shuttles="{{ m.number_of_shuttles }}">{{ m.machine_number }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-md-1">
                  <label class="form-label small mb-0">Total Meshes</label>
                  <input type="number" class="form-control form-control-sm prod-total-meshes bg-light" placeholder="Meshes" readonly>
                </div>
                <div class="col-md-2 d-flex align-items-end gap-1">
                  <button type="button" class="btn btn-sm btn-success add-net-row">+ Net</button>
                  <button type="button" class="btn btn-sm btn-warning add-sel-row">+ Sel</button>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                  <button type="button" class="btn btn-outline-danger btn-sm remove-row" style="display:none;">&times;</button>
                  <button type="button" class="btn btn-outline-primary btn-sm add-row ms-1">+</button>
                </div>
              </div>

              <div class="twine-rows-container"></div>

              <div class="row mb-2 g-1">
                <div class="col-md-2">
                  <label class="form-label small mb-0 fw-bold text-primary">Total Twine</label>
                  <input type="text" class="form-control form-control-sm prod-total-twine bg-light fw-bold" placeholder="Total Twine" readonly>
                </div>
              </div>

              <div class="row mb-2 g-1">
                <div class="col-md-2">
                  <label class="form-label small mb-0">Calculated Weight</label>
                  <input type="text" name="calculated_weight" class="form-control form-control-sm prod-calc-wt bg-light" placeholder="Calc Weight" readonly>
                </div>
                <div class="col-md-2">
                  <label class="form-label small mb-0">Unit Cost</label>
                  <input type="number" step="0.01" name="unit_cost" class="form-control form-control-sm prod-unit-cost" placeholder="Unit Cost">
                </div>
                <div class="col-md-2">
                  <label class="form-label small mb-0">Calculated Cost</label>
                  <input type="text" name="calculated_cost" class="form-control form-control-sm prod-calc-cost bg-light" placeholder="Calc Cost" readonly>
                </div>
                <div class="col-md-3">
                  <label class="form-label small mb-0">Remarks</label>
                  <input type="text" name="remarks" class="form-control form-control-sm prod-remarks" placeholder="Remarks">
                </div>
              </div>

              <hr>
            </div>
          </div>

          <div class="text-center">
            <button type="submit" name="action" value="save" class="btn btn-success">Save Production</button>
          </div>

        </div>
      </form>
    </div>

    <hr>

    <div class="text-center mt-3">
      <a href="{% url 'production_detail' %}" class="btn btn-outline-primary">View Production Details</a>
    </div>

  </div>
</main>

{{ orders_json|json_script:"orders-data" }}
{{ machines_json|json_script:"machines-data" }}
<script>
const ordersData = JSON.parse(document.getElementById("orders-data").textContent);
const machinesData = JSON.parse(document.getElementById("machines-data").textContent);
const productionContainer = document.getElementById("production-rows");

/* Populate all orders in memory and populate dropdown */
const orderSelect = document.getElementById("fetch-order");
const filterProductSelect = document.getElementById("filter-product");

const allOrderOptions = [];
ordersData.forEach(o => {
  const opt = document.createElement("option");
  opt.value = o.order_key;
  opt.textContent = `${o.order_number} - ${o.customer} - ${o.twine || ''}`;
  opt.dataset.order = JSON.stringify(o);
  allOrderOptions.push(opt);
});

function populateOrderDropdown(filterCode) {
  orderSelect.innerHTML = '<option value="">-- Select Order --</option>';
  allOrderOptions.forEach(opt => {
    if (!filterCode) {
      orderSelect.appendChild(opt.cloneNode(true));
    } else {
      const o = JSON.parse(opt.dataset.order);
      if ((o.product_code || "").toLowerCase() === filterCode.toLowerCase()) {
        orderSelect.appendChild(opt.cloneNode(true));
      }
    }
  });
}

populateOrderDropdown("");

/* Filter orders by selected product */
filterProductSelect.addEventListener("change", () => {
  populateOrderDropdown(filterProductSelect.value);
});

/* Populate fields from selected order */
function populateOrderFields() {
  const opt = orderSelect.selectedOptions[0];
  if (!opt || !opt.dataset.order) return;
  const o = JSON.parse(opt.dataset.order);
  const row = productionContainer.querySelector(".production-row");
  row.querySelector(".prod-customer").value = o.customer || "";
  row.querySelector(".prod-spec").value = o.specification || "";
  row.querySelector(".prod-mm").value = o.mm || "";
  row.querySelector(".prod-md").value = o.md || "";
  row.querySelector(".prod-sel").value = o.sel || "";
  row.querySelector(".prod-pw").value = o.pw || "";
  row.querySelector(".prod-qty").value = o.quantity || "";
  row.querySelector(".prod-unit").value = o.quantity_unit || "KG";
  row.querySelector(".prod-product").value = o.product_code || "";
  if (o.product_code) {
    fetchConversionFactor(o.product_code, row);
  }
  recalcRow(row);
}

document.getElementById("fetch-order-btn").addEventListener("click", populateOrderFields);
orderSelect.addEventListener("change", populateOrderFields);

/* Fetch conversion factor via API */
function fetchConversionFactor(productCode, row) {
  if (!productCode) return;
  fetch(`/configuration/material-conversion-ratio?code=${encodeURIComponent(productCode)}`)
    .then(r => r.json())
    .then(data => {
      if (data.conversion_ratio) {
        row.querySelector(".prod-conv").value = data.conversion_ratio;
        recalcRow(row);
      }
    })
    .catch(() => {});
}

/* Machine change -> populate Total Meshes from shuttles */
productionContainer.addEventListener("change", e => {
  if (!e.target.classList.contains("prod-machine")) return;
  const row = e.target.closest(".production-row");
  const machineNum = e.target.value;
  const machine = machinesData.find(m => m.machine_number === machineNum);
  row.querySelector(".prod-total-meshes").value = machine ? machine.number_of_shuttles : "";
});

/* Add NET row */
productionContainer.addEventListener("click", e => {
  if (!e.target.classList.contains("add-net-row")) return;
  const row = e.target.closest(".production-row");
  const container = row.querySelector(".twine-rows-container") || row.parentElement.querySelector(".twine-rows-container");
  addTwineRow(container, "NET");
});

/* Add SEL row */
productionContainer.addEventListener("click", e => {
  if (!e.target.classList.contains("add-sel-row")) return;
  const row = e.target.closest(".production-row");
  const container = row.querySelector(".twine-rows-container") || row.parentElement.querySelector(".twine-rows-container");
  addTwineRow(container, "SEL");
});

function addTwineRow(container, type) {
  const prodRow = container.closest(".production-row") || container.parentElement.querySelector(".production-row");
  const topMM = prodRow ? prodRow.querySelector(".prod-mm").value : "";
  const productCode = prodRow ? prodRow.querySelector(".prod-product").value : "";
  const div = document.createElement("div");
  div.className = "row mb-2 align-items-end g-1 twine-row";
  div.dataset.type = type;
  div.innerHTML = `
    <div class="col-md-1"><span class="badge bg-${type === 'NET' ? 'success' : 'warning'} twine-label">${type}</span></div>
    <div class="col-md-1"><input type="number" step="0.1" class="form-control form-control-sm twine-mm" placeholder="MM" value="${type === 'NET' && topMM ? topMM : ''}"></div>
    <div class="col-md-1"><input type="number" step="0.1" class="form-control form-control-sm twine-md" placeholder="MD"></div>
    <div class="col-md-1"><input type="number" class="form-control form-control-sm twine-pcs" placeholder="Pcs"></div>
    <div class="col-md-1"><input type="text" class="form-control form-control-sm twine-count bg-light" placeholder="Twine Count" readonly></div>
    <div class="col-md-2"><input type="text" class="form-control form-control-sm twine-twine" placeholder="Twine" value="${type === 'NET' && productCode ? productCode : ''}"></div>
    <div class="col-md-2"><input type="text" class="form-control form-control-sm twine-conv bg-light" placeholder="Conversion Factor" readonly></div>
    <div class="col-md-1"><button type="button" class="btn btn-outline-danger btn-sm remove-twine-row">&times;</button></div>
  `;
  container.appendChild(div);
  if (type === 'NET' && productCode) {
    fetchConversionFactorForTwine(productCode, div);
  }
}

function fetchConversionFactorForTwine(productCode, twineRow) {
  if (!productCode) return;
  fetch(`/configuration/material-conversion-ratio?code=${encodeURIComponent(productCode)}`)
    .then(r => r.json())
    .then(data => {
      if (data.conversion_ratio) {
        twineRow.querySelector(".twine-conv").value = data.conversion_ratio;
      }
    })
    .catch(() => {});
}

/* Remove twine row */
productionContainer.addEventListener("click", e => {
  if (!e.target.classList.contains("remove-twine-row")) return;
  const twineRow = e.target.closest(".twine-row");
  const parentProductionRow = e.target.closest(".production-row");
  twineRow.remove();
  updateTotalTwine(parentProductionRow);
});

/* Twine Count = MD x Pcs */
productionContainer.addEventListener("input", e => {
  if (e.target.classList.contains("twine-md") || e.target.classList.contains("twine-pcs")) {
    const twineRow = e.target.closest(".twine-row");
    const md = parseFloat(twineRow.querySelector(".twine-md").value) || 0;
    const pcs = parseFloat(twineRow.querySelector(".twine-pcs").value) || 0;
    twineRow.querySelector(".twine-count").value = (md * pcs) ? (md * pcs).toFixed(1) : "";
    const prodRow = e.target.closest(".production-row");
    updateTotalTwine(prodRow);
  }
});

function updateTotalTwine(row) {
  if (!row) return;
  let total = 0;
  const container = row.parentElement.querySelector(".twine-rows-container");
  if (container) {
    container.querySelectorAll(".twine-row").forEach(tr => {
      total += parseFloat(tr.querySelector(".twine-count").value) || 0;
    });
  }
  const totalEl = row.querySelector(".prod-total-twine");
  if (totalEl) totalEl.value = total ? total.toFixed(1) : "0";
}

/* Recalculate row */
function recalcRow(row) {
  const qty = parseFloat(row.querySelector(".prod-qty").value) || 0;
  const conv = parseFloat(row.querySelector(".prod-conv").value) || 0;
  const unitCost = parseFloat(row.querySelector(".prod-unit-cost").value) || 0;
  const times = parseInt(row.querySelector(".prod-times").value) || 1;
  const calcWt = qty * conv * times;
  const calcCost = calcWt * unitCost;
  row.querySelector(".prod-calc-wt").value = calcWt ? calcWt.toFixed(2) : "";
  row.querySelector(".prod-calc-cost").value = calcCost ? calcCost.toFixed(2) : "";
}

productionContainer.addEventListener("input", e => {
  if (e.target.classList.contains("prod-qty") || e.target.classList.contains("prod-unit-cost") || e.target.classList.contains("prod-times")) {
    const row = e.target.closest(".production-row");
    recalcRow(row);
  }
});

/* Add row */
productionContainer.addEventListener("click", e => {
  if (!e.target.classList.contains("add-row")) return;
  const firstRow = productionContainer.querySelector(".production-row");
  const newRow = firstRow.cloneNode(true);
  newRow.querySelectorAll("input").forEach(i => {
    if (i.classList.contains("prod-times")) { i.value = "1"; return; }
    if (i.readOnly) { i.value = ""; return; }
    if (!i.classList.contains("prod-unit-cost")) i.value = "";
  });
  newRow.querySelectorAll("select").forEach(s => s.selectedIndex = 0);
  newRow.querySelector(".remove-row").style.display = "";
  newRow.querySelector(".prod-total-meshes").value = "";
  newRow.querySelector(".prod-total-twine").value = "";
  const twineContainer = newRow.parentElement.querySelector(".twine-rows-container");
  if (twineContainer) {
    const clonedTwines = twineContainer.querySelectorAll(".twine-row");
    clonedTwines.forEach(tw => tw.remove());
  }
  productionContainer.appendChild(newRow);
});

/* Remove row */
productionContainer.addEventListener("click", e => {
  if (!e.target.classList.contains("remove-row")) return;
  const rows = productionContainer.querySelectorAll(".production-row");
  if (rows.length <= 1) { alert("At least one row required"); return; }
  e.target.closest(".production-row").remove();
});

/* Submit */
document.getElementById("production-form").addEventListener("submit", e => {
  const entries = [];
  const date = document.getElementById("production-date").value;
  productionContainer.querySelectorAll(".production-row").forEach(row => {
    const machine = row.querySelector(".prod-machine").value;
    if (!machine) return;
    entries.push({
      production_date: date,
      customer: row.querySelector(".prod-customer").value,
      specification: row.querySelector(".prod-spec").value,
      reference: row.querySelector(".prod-ref").value,
      mm: row.querySelector(".prod-mm").value,
      md: row.querySelector(".prod-md").value,
      product: row.querySelector(".prod-product").value,
      sel: row.querySelector(".prod-sel").value,
      pw: row.querySelector(".prod-pw").value,
      quantity: row.querySelector(".prod-qty").value,
      quantity_unit: row.querySelector(".prod-unit").value,
      machine: machine,
      calculated_weight: row.querySelector(".prod-calc-wt").value,
      unit_cost: row.querySelector(".prod-unit-cost").value,
      calculated_cost: row.querySelector(".prod-calc-cost").value,
      remarks: row.querySelector(".prod-remarks").value,
      total_meshes: row.querySelector(".prod-total-meshes").value,
      total_twine: row.querySelector(".prod-total-twine").value,
      twine_rows: [],
    });
    const twineContainer = row.parentElement.querySelector(".twine-rows-container");
    if (twineContainer) {
      twineContainer.querySelectorAll(".twine-row").forEach(tr => {
        entries[entries.length - 1].twine_rows.push({
          type: tr.dataset.type,
          mm: tr.querySelector(".twine-mm").value,
          md: tr.querySelector(".twine-md").value,
          pcs: tr.querySelector(".twine-pcs").value,
          twine_count: tr.querySelector(".twine-count").value,
          twine: tr.querySelector(".twine-twine").value,
          conversion_factor: tr.querySelector(".twine-conv").value,
        });
      });
    }
  });
  if (entries.length === 0) {
    e.preventDefault();
    alert("Please fill at least one row with a Machine selected.");
    return;
  }
  document.getElementById("entries-data").value = JSON.stringify(entries);
});
</script>
{% endblock %}
